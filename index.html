<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>San Valentín</title>

<style>
body{
background:#fdecef;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

button{
padding:12px 25px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
margin:10px;
}

#no{
position:absolute;
}
</style>
</head>

<body>

<div class="card">
<h2>Wendy, ¿serías mi San Valentín? ❤️</h2>

<button onclick="alert('Sabía que dirías que sí 😍')">Sí</button>
<button id="no">No</button>
</div>

<script>
const no = document.getElementById("no");

no.addEventListener("mouseover", ()=>{
no.style.left = Math.random()*300+"px";
no.style.top = Math.random()*300+"px";
});
</script>

</body>
</html>
